[package]
name = "matrix-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"

[dependencies]
chrono = { version = "=0.4.39", default-features = false, features = ["clock", "serde"] }
directories = "=5.0.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.8"
thiserror = "=2.0.11"
uuid = { version = "=1.11.0", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "=3.15.0"
