[package]
name = "jzmatrix-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"

[[bin]]
name = "jzmatrix"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.27", features = ["derive"] }
matrix-core = { path = "../matrix-core" }
serde_json = "=1.0.145"

[dev-dependencies]
tempfile = "=3.15.0"
